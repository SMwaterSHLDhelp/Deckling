name: Build plugin

# Runs on every push and pull request, including Dependabot. The build job
# typechecks, lints, tests, and builds the Decky zip, and it only needs read
# access so Dependabot's token can run it. The release job runs on version tags.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and lint the frontend
        run: |
          pnpm run typecheck
          pnpm run lint
          node --experimental-strip-types scripts/game-context.test.ts
          node --experimental-strip-types scripts/game-watch.test.ts
          node --experimental-strip-types scripts/page-shell.test.ts

      - name: Lint and test the backend
        run: |
          python -m pip install -r requirements-dev.txt
          ruff check main.py py_modules tests bridge scripts
          python -m pytest -q

      - name: Install Decky CLI
        run: |
          curl -fsSL -o "$RUNNER_TEMP/decky" \
            "https://github.com/SteamDeckHomebrew/cli/releases/download/0.0.8/decky-linux-x86_64"
          chmod +x "$RUNNER_TEMP/decky"

      - name: Build plugin zip
        run: |
          "$RUNNER_TEMP/decky" plugin build -o "$GITHUB_WORKSPACE/out" .
          zipfile="$(find out -name '*.zip' -print -quit)"
          test -n "$zipfile"
          if [ "$zipfile" != "out/Deckling.zip" ]; then
            mv "$zipfile" out/Deckling.zip
          fi

      - name: Check Decky zip layout
        run: |
          python3 - <<'PY'
          import zipfile
          archive = zipfile.ZipFile("out/Deckling.zip")
          names = [name for name in archive.namelist() if name and not name.endswith("/")]
          roots = {name.split("/", 1)[0] for name in names}
          if len(roots) != 1:
              raise SystemExit(f"expected one top-level folder, found {sorted(roots)}")
          root = next(iter(roots))
          if root != "Deckling":
              raise SystemExit(f"top-level folder must be Deckling, found {root}")
          required = [
              f"{root}/plugin.json",
              f"{root}/dist/index.js",
              f"{root}/main.py",
              f"{root}/package.json",
              f"{root}/LICENSE",
          ]
          missing = [name for name in required if name not in names]
          if missing:
              raise SystemExit("zip is missing: " + ", ".join(missing))
          print(f"Decky zip layout ok under {root}/")
          PY

      - name: Upload plugin zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Deckling
          path: out/Deckling.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download plugin zip
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Deckling
          path: out

      - name: Place the zip where the release expects it
        run: |
          zipfile="$(find out -name 'Deckling.zip' -print -quit)"
          test -n "$zipfile"
          if [ "$zipfile" != "out/Deckling.zip" ]; then
            mv "$zipfile" out/Deckling.zip
          fi

      - name: Write release notes
        run: python3 scripts/release_notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Attach zip to the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: out/Deckling.zip
          body_path: ${{ runner.temp }}/release-notes.md
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
