name: Decky drift

# Rebuilds main against the newest @decky/ui, @decky/api, and Decky CLI.
# A failure opens (or comments on) an issue labeled decky-api-drift.
# A later passing run closes that issue.

on:
  schedule:
    - cron: "23 7 * * 4"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install -r requirements-dev.txt

      - name: Rebuild with the latest Decky libraries
        id: drift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          {
            echo "Updating @decky/ui and @decky/api"
            pnpm add -D "@decky/ui@latest"
            pnpm add "@decky/api@latest"
            pnpm list @decky/ui @decky/api --depth 0
            pnpm run typecheck
            pnpm run lint
            ruff check main.py py_modules tests bridge scripts
            python -m pytest -q
            python3 scripts/install_latest_decky_cli.py "$RUNNER_TEMP/decky"
            "$RUNNER_TEMP/decky" plugin build -o "$GITHUB_WORKSPACE/out" .
          } 2>&1 | tee "$RUNNER_TEMP/drift.log"

      - name: Report the drift result
        if: always() && (steps.drift.outcome == 'success' || steps.drift.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ steps.drift.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRIFT_LOG: ${{ runner.temp }}/drift.log
        run: python3 scripts/decky_drift_issue.py
